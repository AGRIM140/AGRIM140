<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DELL DIMENSION // AGRIM SINGH WORKSTATION v2026.11</title>
  <style>
    :root {
      --chassis-beige: #D6D0C4;
      --chassis-light: #EAE6DC;
      --chassis-shadow: #77766F;
      --crt-black: #121513;
      --crt-green: #78966B;
      --crt-bright: #98C379;
      --crt-amber: #D19A66;
      --crt-blue: #607D8B;
      --term-font: 'Courier New', Courier, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #1a1c1e;
      background-image: radial-gradient(#2a2d30 15%, transparent 16%), radial-gradient(#222528 15%, transparent 16%);
      background-size: 60px 60px;
      background-position: 0 0, 30px 30px;
      color: var(--crt-bright);
      font-family: var(--term-font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 10px;
    }

    /* VINTAGE MONITOR CHASSIS */
    .monitor-bezel {
      background: var(--chassis-beige);
      border-top: 6px solid var(--chassis-light);
      border-left: 6px solid var(--chassis-light);
      border-right: 6px solid var(--chassis-shadow);
      border-bottom: 6px solid var(--chassis-shadow);
      border-radius: 18px;
      padding: 30px 30px 40px 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 2px 5px rgba(255,255,255,0.4);
      max-width: 1080px;
      width: 100%;
      position: relative;
    }

    .monitor-brand {
      position: absolute;
      top: 10px;
      left: 36px;
      font-size: 11px;
      font-weight: bold;
      color: var(--chassis-shadow);
      letter-spacing: 2px;
    }

    .monitor-controls {
      position: absolute;
      bottom: 12px;
      right: 36px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .monitor-btn {
      width: 18px;
      height: 18px;
      background: var(--chassis-beige);
      border-top: 2px solid var(--chassis-light);
      border-left: 2px solid var(--chassis-light);
      border-right: 2px solid var(--chassis-shadow);
      border-bottom: 2px solid var(--chassis-shadow);
      border-radius: 3px;
      cursor: pointer;
    }
    .monitor-btn:active {
      border-top: 2px solid var(--chassis-shadow);
      border-left: 2px solid var(--chassis-shadow);
      border-right: 2px solid var(--chassis-light);
      border-bottom: 2px solid var(--chassis-light);
    }

    .power-led {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #78966B;
      box-shadow: 0 0 6px #78966B;
      animation: ledPulse 2s infinite ease-in-out;
    }
    @keyframes ledPulse {
      0%, 100% { opacity: 1; filter: brightness(1.2); }
      50% { opacity: 0.6; filter: brightness(0.8); }
    }

    /* CRT INNER SCREEN */
    .crt-screen-wrap {
      background: var(--crt-black);
      border: 14px solid #242424;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 0 40px rgba(0,0,0,0.9), 0 0 10px rgba(0,0,0,0.5);
    }

    /* SCANLINE & FLICKER OVERLAY */
    .scanlines {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%),
                  linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
      z-index: 10;
    }

    .crt-glow {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, transparent 60%, rgba(0,0,0,0.6) 100%);
      pointer-events: none;
      z-index: 11;
    }

    /* TERMINAL CONTENT AREA */
    .terminal-body {
      height: 600px;
      overflow-y: auto;
      padding: 24px;
      font-size: 14px;
      line-height: 1.5;
      text-shadow: 0 0 4px rgba(120, 150, 107, 0.6);
      position: relative;
      z-index: 5;
    }

    .terminal-body::-webkit-scrollbar { width: 8px; }
    .terminal-body::-webkit-scrollbar-track { background: #121513; }
    .terminal-body::-webkit-scrollbar-thumb { background: var(--chassis-shadow); }

    /* TEXT HIGHLIGHTS */
    .txt-green { color: var(--crt-bright); }
    .txt-dim { color: var(--chassis-shadow); }
    .txt-cream { color: var(--chassis-light); }
    .txt-blue { color: #82AAFF; }
    .txt-amber { color: var(--crt-amber); }

    .bold { font-weight: bold; }

    /* CLI INPUT LINE */
    .cmd-line {
      display: flex;
      align-items: center;
      margin-top: 10px;
    }
    .cmd-prompt {
      color: var(--crt-bright);
      margin-right: 8px;
      white-space: nowrap;
    }
    .cmd-input {
      background: transparent;
      border: none;
      color: var(--chassis-light);
      font-family: inherit;
      font-size: inherit;
      flex: 1;
      outline: none;
      text-shadow: inherit;
    }

    .cursor {
      display: inline-block;
      width: 9px;
      height: 16px;
      background: var(--crt-bright);
      animation: blink 1s infinite;
      vertical-align: middle;
      margin-left: 2px;
    }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

    /* ASCII BOX STYLING */
    .ascii-box {
      border: 1px solid var(--chassis-shadow);
      padding: 10px 14px;
      margin: 10px 0;
      background: rgba(36, 36, 36, 0.4);
    }

    /* QUICK COMMAND BUTTONS */
    .quick-toolbar {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-width: 1080px;
      width: 100%;
    }
    .quick-btn {
      background: var(--chassis-beige);
      border-top: 2px solid var(--chassis-light);
      border-left: 2px solid var(--chassis-light);
      border-right: 2px solid var(--chassis-shadow);
      border-bottom: 2px solid var(--chassis-shadow);
      padding: 6px 14px;
      font-family: var(--term-font);
      font-size: 12px;
      font-weight: bold;
      color: #242424;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.1s;
    }
    .quick-btn:hover { background: #E2DDD3; }
    .quick-btn:active {
      border-top: 2px solid var(--chassis-shadow);
      border-left: 2px solid var(--chassis-shadow);
      border-right: 2px solid var(--chassis-light);
      border-bottom: 2px solid var(--chassis-light);
    }

    a.term-link {
      color: #82AAFF;
      text-decoration: underline;
    }
    a.term-link:hover {
      color: #EAE6DC;
    }
  </style>
</head>
<body>

  <!-- MONITOR HOUSING -->
  <div class="monitor-bezel">
    <div class="monitor-brand">DELL DIMENSION // ROM_REV_2026.11 // AGRIM140-WKSTN</div>

    <!-- INNER CRT DISPLAY -->
    <div class="crt-screen-wrap">
      <div class="scanlines"></div>
      <div class="crt-glow"></div>

      <div class="terminal-body" id="termOutput">
        <!-- Live content injected via JS -->
      </div>
    </div>

    <!-- PHYSICAL BEZEL CONTROLS -->
    <div class="monitor-controls">
      <span style="font-size:10px; color:#77766F; font-weight:bold;">POWER</span>
      <div class="power-led" title="System Powered"></div>
      <button class="monitor-btn" onclick="toggleAudio()" title="Toggle PC Speaker Audio" id="audioBtn">🔊</button>
      <button class="monitor-btn" onclick="togglePhosphor()" title="Toggle Phosphor Mode (Green/Amber/Mono)">CRT</button>

    <button class="quick-btn" onclick="execQuick('whoami')">[F2] WHOAMI</button>

    <button class="quick-btn" onclick="execQuick('cat a-imcs')">[F4] A-IMCS SPEC</button>
    <button class="quick-btn" onclick="execQuick('specs')">[F5] DRIVERS & TECH</button>
    <button class="quick-btn" onclick="execQuick('telemetry')">[F6] TELEMETRY</button>
    <button class="quick-btn" onclick="execQuick('contact')">[F7] COM PORTS</button>

  <script>
    // WEB AUDIO RETRO SOUND SYNTHESIZER
    let audioEnabled = true;
    let audioCtx = null;

    function getAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    }

    function playBeep(freq = 800, duration = 0.08, type = 'square') {
      if (!audioEnabled) return;
      try {
        const ctx = getAudioCtx();
        if (ctx.state === 'suspended') ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.06, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch(e) {}
    }

    function playKeyClick() {
      playBeep(2400 + Math.random() * 400, 0.015, 'triangle');
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      document.getElementById('audioBtn').innerText = audioEnabled ? '🔊' : '🔇';
    }

    let colorThemes = ['green', 'amber', 'mono'];
    let curTheme = 0;
    function togglePhosphor() {
      curTheme = (curTheme + 1) % colorThemes.length;
      const theme = colorThemes[curTheme];
      const root = document.documentElement;
      if (theme === 'amber') {
        root.style.setProperty('--crt-bright', '#F4B056');
        root.style.setProperty('--crt-green', '#D19A66');
      } else if (theme === 'mono') {
        root.style.setProperty('--crt-bright', '#EAE6DC');
        root.style.setProperty('--crt-green', '#D6D0C4');
      } else {
        root.style.setProperty('--crt-bright', '#98C379');
        root.style.setProperty('--crt-green', '#78966B');
      }
      playBeep(1200, 0.05);
    }

    // COMMAND PROCESSOR & DATA
    const COMMANDS = {

  -------------------------------------------------------------

  <span class="txt-green">cat [id]</span>     : Inspect project spec (<span class="txt-amber">cat a-imcs</span>, <span class="txt-amber">cat aereo</span>, <span class="txt-amber">cat smart-crop</span>)
  <span class="txt-green">specs</span>        : Dump loaded programming languages & framework drivers
  <span class="txt-green">status</span>       : System deployment status @ Pentagon Rugged Systems
  <span class="txt-green">telemetry</span>    : Hardware telemetry & resource utilization metrics

  <span class="txt-green">clear</span>        : Clear the current TTY buffer
  <span class="txt-green">reboot</span>       : Reinitialize workstation POST boot sequence
</div>`,

      whoami: () => `

  LEADERSHIP  : Founder @ Recursion (SMIT Coding & GATE Prep Club)
                Google Campus Ambassador @ SMIT
</div>`,

      projects: () => `
<div class="ascii-box">
  <span class="txt-cream bold">PRIMARY VOLUMES MOUNTED (/dev/sda1):</span>
  ----------------------------------------------------------------------
  <span class="txt-green">[01] a-imcs</span>      : Autonomous Mobile Camouflage & UGV Scene Perception
  <span class="txt-green">[02] aereo</span>       : High-Throughput Async Certificate Engine (DRF/Celery)
  <span class="txt-green">[03] smart-crop</span>  : Explainable AI Agricultural Yield/Cost Predictor
  <span class="txt-green">[04] gan-restore</span> : Image Super-Res & Blind Denoising Suite (PyTorch)
  <span class="txt-green">[05] drug-rating</span> : Pharma Side-Effect Analysis (Random Forest/Streamlit)
  <span class="txt-green">[06] healsync</span>    : Hospital Decision Support Microservice (Spring Boot/FastAPI)

  ----------------------------------------------------------------------
  <span class="txt-dim">Type 'cat [name]' to view architectural blueprints.</span>
</div>`,

      'cat a-imcs': () => `

  <span class="txt-cream bold">FILE_01 // /opt/pentagon/a-imcs (A-IMCS & AGVS PERCEPTION)</span>
  ----------------------------------------------------------------------

      'cat aereo': () => `

  <span class="txt-cream bold">FILE_02 // /srv/backend/aereo (AEREO BULK CERTIFICATE ENGINE)</span>
  ----------------------------------------------------------------------
  REPO         : <a class="term-link" href="https://github.com/AGRIM140/aereo-certificate-bulk-generator" target="_blank">github.com/AGRIM140/aereo-certificate-bulk-generator</a>

</div>`,

      status: () => `
<div class="ascii-box">

  ● pentagon-rugged-systems.service - A-IMCS & AGVS Stack
     Loaded: active (running) since Boot
     Focus : Computer Vision, ROS 2 Middleware, Sensor Fusion, UGV Control
     Status: <span class="txt-green">OPTIMAL // ENGAGED IN ACTIVE R&D</span>
</div>`,

      specs: () => `
<div class="ascii-box">
  <span class="txt-cream bold">LOADED HARDWARE DRIVERS & COMPILERS:</span>
  -------------------------------------------------------------
  [LANGUAGES]    : Python, C, C++, Java, JavaScript, TypeScript

  [BACKEND / DB] : Django REST, FastAPI, Spring Boot, PostgreSQL, Redis, Celery
  [INFRASTRUCTURE: Docker, Google Cloud Run, Git, Linux
</div>`,

      telemetry: () => `
<div class="ascii-box">
  <span class="txt-cream bold">TELEMETRY MONITOR CH_01:</span>
  -------------------------------------------------------------
  USER_ID       : AGRIM140
  HOST_NODE     : AGRIM140-WKSTN (Dell OptiPlex BIOS v2026.11)
  UPTIME_CADENCE: SUSTAINED COMMIT STREAK [ONLINE]
  PRIMARY_LANG  : Python (89.55%), C++ (4.95%), Cython (3.64%)
  HEALTH_INDEX  : 99.98% COMPILED // ZERO FATAL RUNTIME INTERRUPTS
</div>`,

      contact: () => `
<div class="ascii-box">
  <span class="txt-cream bold">SERIAL COMMUNICATION PORTS (COM LIST):</span>
  -------------------------------------------------------------
  [COM1] GITHUB   : <a class="term-link" href="https://github.com/AGRIM140" target="_blank">https://github.com/AGRIM140</a>
  [COM2] LINKEDIN : <a class="term-link" href="https://www.linkedin.com/in/agrim-singh/" target="_blank">https://www.linkedin.com/in/agrim-singh/</a>
  [COM3] EMAIL    : <a class="term-link" href="mailto:agrims.singh@gmail.com">agrims.singh@gmail.com</a>

    };

    const outputEl = document.getElementById('termOutput');

    function print(html) {
      const line = document.createElement('div');
      line.innerHTML = html;
      outputEl.appendChild(line);
      outputEl.scrollTop = outputEl.scrollHeight;
    }

    function createInputPrompt() {
      const line = document.createElement('div');
      line.className = 'cmd-line';
      line.innerHTML = `
        <span class="cmd-prompt">agrim@workstation:~$</span>
        <input type="text" class="cmd-input" autofocus autocomplete="off" spellcheck="false" />
      `;
      outputEl.appendChild(line);
      const input = line.querySelector('.cmd-input');
      input.focus();

      input.addEventListener('keydown', (e) => {
        playKeyClick();
        if (e.key === 'Enter') {
          const val = input.value.trim().toLowerCase();
          line.innerHTML = `<span class="cmd-prompt">agrim@workstation:~$</span> <span class="txt-cream">${input.value}</span>`;
          handleCommand(val);
          createInputPrompt();
        }
      });
      outputEl.scrollTop = outputEl.scrollHeight;
    }

    function handleCommand(cmd) {
      if (!cmd) return;
      playBeep(900, 0.04);
      if (cmd === 'clear') {
        outputEl.innerHTML = '';
        return;
      }
      if (cmd === 'reboot') {
        rebootSystem();
        return;
      }
      if (COMMANDS[cmd]) {
        print(COMMANDS[cmd]());
      } else if (cmd.startsWith('cat ')) {
        const key = cmd.replace(/\s+/g, ' ');
        if (COMMANDS[key]) {
          print(COMMANDS[key]());
        } else {
          print(`<span class="txt-amber">cat: ${cmd.substring(4)}: No such file or directory. Try 'projects'</span>`);
        }
      } else {
        print(`<span class="txt-amber">command not found: '${cmd}'. Type <span class="txt-green bold">'help'</span> for system commands.</span>`);
      }
    }

    function execQuick(cmd) {
      playBeep(1100, 0.04);
      print(`<span class="cmd-prompt">agrim@workstation:~$</span> <span class="txt-cream">${cmd}</span>`);
      handleCommand(cmd);
      const inputs = document.querySelectorAll('.cmd-input');
      if (inputs.length) inputs[inputs.length - 1].focus();
    }

    function bootSequence() {
      outputEl.innerHTML = '';
      playBeep(440, 0.2, 'sawtooth');
      setTimeout(() => playBeep(880, 0.15, 'square'), 250);

      const bootLines = [
        '<span class="txt-dim">SYS_BIOS // ROM_REV_2026.11 [DELL OPTIPLEX / DIMENSION WKSTN]</span>',
        '<span class="txt-dim">CPU: x86_64 // ALLOC_MEM: 640K BASE CONVENTIONAL... 32768M EXTENDED [OK]</span>',

        '---------------------------------------------------------------------------',
        '<span class="txt-green bold">> POST CHECK: OK. MOUNTING /dev/sda1 (AGRIM140 ROOT KERNEL)...</span>',
        '<span class="txt-cream bold">===========================================================================</span>',
        '<span class="txt-cream bold">  AGRIM SINGH // RETRO BRUTALIST DEVELOPER WORKSTATION OS v2026.11</span>',
        '<span class="txt-cream bold">===========================================================================</span>',
        '<span class="txt-dim">Perception, Robotics & Backend Systems @ SMIT / Pentagon Rugged Systems</span>',
        '<span class="txt-dim">Type <span class="txt-green bold">\'help\'</span> for vector commands or use [F1-F7] hardware switches below.</span>',
        '---------------------------------------------------------------------------'
      ];

      bootLines.forEach((l, idx) => {
        setTimeout(() => {
          print(l);
          if (idx === bootLines.length - 1) {
            createInputPrompt();
          }
        }, idx * 45);
      });
    }

    function rebootSystem() {
      bootSequence();
    }

    // Auto-focus input on click anywhere inside screen
    document.querySelector('.crt-screen-wrap').addEventListener('click', () => {
      const inputs = document.querySelectorAll('.cmd-input');
      if (inputs.length) inputs[inputs.length - 1].focus();
    });

    // Run initial boot
    window.addEventListener('load', () => {
      bootSequence();
    });
  </script>
</body>
</html>
